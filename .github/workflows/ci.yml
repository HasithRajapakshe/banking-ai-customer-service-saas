name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-tests:
    name: backend-tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # Run every service even if one fails, so a single run shows all failures.
      fail-fast: false
      matrix:
        service:
          - synthetic-bank
          - banking-adapter
          - tool-gateway
          - ai-agent
          - api-gateway
          - rag

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  # Alembic is the schema source of truth: migrate a real pgvector database
  # (down to base and back up) and check every service's ORM against it.
  schema-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: schema_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d schema_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/schema_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: database/requirements-test.txt

      - name: Install dependencies
        run: pip install -r database/requirements-test.txt

      - name: Run schema alignment tests
        run: python -m pytest database/tests

  # Full stack from scratch (no .env: compose defaults), then the end-to-end
  # confirmation flow through the public API.
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-e2e.txt

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for stack
        run: |
          for job in migrate rag-backfill; do
            for i in $(seq 1 60); do
              state=$(docker inspect "$job" --format '{{.State.Status}}')
              [ "$state" = "exited" ] && break
              sleep 5
            done
            code=$(docker inspect "$job" --format '{{.State.ExitCode}}')
            echo "$job: state=$state exit=$code"
            [ "$state" = "exited" ] && [ "$code" = "0" ] || exit 1
          done
          for i in $(seq 1 60); do
            status=$(docker inspect api-gateway --format '{{.State.Health.Status}}')
            echo "api-gateway: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Install e2e dependencies
        run: pip install -r scripts/requirements-e2e.txt

      - name: Run e2e tests
        run: python -m pytest -v scripts/e2e_test.py

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker config
        run: docker compose config --quiet

      - name: Docker build
        run: docker compose build
