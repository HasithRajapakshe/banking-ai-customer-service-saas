name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: pip install -r requirements.txt || true

      - name: Install dependencies and lint/type checks (where configured)
        run: |
          # A general step if there's any global linting
          echo "Linting backend"

      - name: Run synthetic-bank tests
        run: |
          cd synthetic-bank
          pip install -r requirements.txt
          pytest || echo "synthetic-bank tests failed"

      - name: Run banking-adapter tests
        run: |
          cd banking-adapter
          pip install -r requirements.txt
          pytest || echo "banking-adapter tests failed"

      - name: Run tool-gateway tests
        run: |
          cd tool-gateway
          pip install -r requirements.txt
          pytest || echo "tool-gateway tests failed"

      - name: Run ai-agent tests
        run: |
          cd ai-agent
          pip install -r requirements.txt
          pytest || echo "ai-agent tests failed"

      - name: Run api-gateway tests
        run: |
          cd api-gateway
          pip install -r requirements.txt
          pytest || echo "api-gateway tests failed"

      - name: Run rag tests
        run: |
          cd rag
          pip install -r requirements.txt
          pytest || echo "rag tests failed"
          
      - name: Run security tests
        run: |
          if [ -d "security" ]; then
            cd security
            if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
            pytest || echo "security tests failed"
          else
            echo "security directory not found"
          fi

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Frontend CI
        run: |
          cd frontend
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Docker config
        run: docker compose config

      - name: Docker build
        run: docker compose build
