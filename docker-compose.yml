services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: banking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  synthetic-bank:
    build: ./synthetic-bank
    container_name: synthetic-bank
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${SYNTHETIC_BANK_API_KEY}
      BANK_CODE: ${BANK_CODE}
      TENANT_ID: ${TENANT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  banking-adapter:
    build: ./banking-adapter
    container_name: banking-adapter
    ports:
      - "8002:8002"
    environment:
      SYNTHETIC_BANK_BASE_URL: http://synthetic-bank:8000
      SYNTHETIC_BANK_API_KEY: ${SYNTHETIC_BANK_API_KEY}
      INTERNAL_API_KEY: ${BANKING_ADAPTER_API_KEY}
    depends_on:
      synthetic-bank:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  tool-gateway:
    build: ./tool-gateway
    container_name: tool-gateway
    ports:
      - "8003:8003"
    environment:
      BANKING_ADAPTER_BASE_URL: http://banking-adapter:8002
      BANKING_ADAPTER_API_KEY: ${BANKING_ADAPTER_API_KEY}
    depends_on:
      banking-adapter:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-agent:
    build: ./ai-agent
    container_name: ai-agent
    ports:
      - "8004:8004"
    environment:
      APP_ENV: development
      TOOL_GATEWAY_BASE_URL: http://tool-gateway:8003
    depends_on:
      tool-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOOL_GATEWAY_BASE_URL: http://tool-gateway:8003
      AI_AGENT_BASE_URL: http://ai-agent:8004
      TENANT_ID: ${TENANT_ID}
      SYNTHETIC_BANK_API_KEY: ${SYNTHETIC_BANK_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  rag:
    build: ./rag
    container_name: rag-service
    ports:
      - "8005:8005"
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: